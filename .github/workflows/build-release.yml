name: Build and Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release ARM64 + ARMv7 APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Restore Release Keystore
        run: |
          if [ ! -f "app/release.keystore" ]; then
            echo "Restoring release keystore from embedded signature..."
            echo "" | base64 -d > app/release.keystore
          fi

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Build Optimized Release APKs (assembleRelease)
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare Release Artifacts
        run: |
          VERSION=$(grep -o '"version": *"[^"]*"' version.json | cut -d'"' -f4)
          echo "Packaging DexOptX v${VERSION} APKs..."
          APK_DIR="app/build/outputs/apk/release"
          # Rename ABI-split APKs to clean names
          if [ -f "${APK_DIR}/app-arm64-v8a-release.apk" ]; then
            cp "${APK_DIR}/app-arm64-v8a-release.apk" "${APK_DIR}/DexOptX-v${VERSION}-arm64-v8a-release.apk"
            cp "${APK_DIR}/app-arm64-v8a-release.apk" "${APK_DIR}/DexOptX-arm64-v8a-release.apk"
          fi
          if [ -f "${APK_DIR}/app-armeabi-v7a-release.apk" ]; then
            cp "${APK_DIR}/app-armeabi-v7a-release.apk" "${APK_DIR}/DexOptX-v${VERSION}-armeabi-v7a-release.apk"
            cp "${APK_DIR}/app-armeabi-v7a-release.apk" "${APK_DIR}/DexOptX-armeabi-v7a-release.apk"
          fi
          echo "Done. Listing artifacts:"
          ls -lh ${APK_DIR}/DexOptX-*.apk

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DexOptX-Release-APKs
          path: app/build/outputs/apk/release/DexOptX-*.apk
          if-no-files-found: error

      - name: Determine Release Tag
        id: release_tag
        run: |
          VERSION=$(grep -o '"version": *"[^"]*"' version.json | cut -d'"' -f4)
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: DexOptX ${{ steps.release_tag.outputs.tag }}
          files: |
            app/build/outputs/apk/release/DexOptX-*-release.apk
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ### DexOptX ${{ steps.release_tag.outputs.tag }} Release

            #### Available APKs:
            * **ARM64 (v8a)** - For modern 64-bit devices (Nvidia Shield, most phones from 2017+)
            * **ARMv7 (v7a)** - For older 32-bit ARM devices

            #### What's New:
            * Dual-architecture APK builds (ARM64 + ARMv7)
            * In-app updater automatically picks the correct APK for your device
            * Direct in-app APK downloading with live progress and automatic installation
            * Fixed ART Inspector dialog button truncation on mobile and Android TV
            * Full D-pad remote focus navigation for Nvidia Shield
            * R8 code shrinking and resource optimization for minimal APK size
