name: Build and Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release ARM64 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Restore Release Keystore
        run: |
          if [ ! -f "app/release.keystore" ]; then
            echo "Restoring release keystore from embedded signature..."
            echo "" | base64 -d > app/release.keystore
          fi

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Build Optimized Release APK (assembleRelease)
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare Release Artifacts
        run: |
          VERSION=$(grep -o '"version": *"[^"]*"' version.json | cut -d'"' -f4)
          echo "Packaging DexOptX v${VERSION}..."
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/DexOptX-v${VERSION}-release.apk
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/DexOptX-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DexOptX-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.6' }}
          name: DexOptX ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.6' }}
          files: |
            app/build/outputs/apk/release/DexOptX-*-release.apk
            app/build/outputs/apk/release/DexOptX-release.apk
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ### DexOptX v1.0.6 Release (ARM64-v8a Optimized)

            #### What's New:
            * **Definitive ART Compilation Detection:** Swapped brittle streaming parser with robust `base.apk` & primary-ABI targeting (`arm64-v8a`), eliminating false `verify` statuses from split APKs.
            * **Forced Compilation Execution (`-f`):** Fixed silent compile skips by always passing `-f` to `cmd package compile`.
            * **Post-Compile Live Verification:** DexOptX directly verifies and logs ART compiler filters (`speed`, `speed-profile`, `verify`) after every compilation run.
            * **Interactive Liquid Glass ART Inspector:** Tap any status badge on Phone or TV to view the live compiler filter, compilation reason, primary ABI, `.odex` artifact path, on-demand re-check, and single-app compilation.
            * **Automated Package Lifecycle Detection:** Integrated a dynamic `BroadcastReceiver` (`ACTION_PACKAGE_ADDED`, `ACTION_PACKAGE_REPLACED`, `ACTION_PACKAGE_REMOVED`) and an `ON_RESUME` lifecycle observer to automatically re-scan apps whenever an app is updated, installed, or uninstalled.
            * **Dedicated Header Refresh Button:** Added a clean manual refresh button in the header for 1-tap re-scans.
            * **Full ARM64-v8a Optimization:** Built with R8 code shrinking, resource shrinking, and pure 64-bit ARM architecture for maximum fluidity and zero lag.
